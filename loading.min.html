<!DOCTYPE html><html lang="${lang}"><head><meta charset="utf-8"><title>${title}</title><style>body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;margin-top:12vh;background:#fafafa;color:#333}.box{max-width:380px;margin:auto;padding:28px 24px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.04)}h2{font-size:18px;margin:0 0 8px;color:#111}.desc{color:#666;font-size:13px;line-height:1.5;margin:0 0 20px}.bar-wrap{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin:16px 0 10px}.bar{height:100%;width:0;background:#0066cc;border-radius:4px;transition:width ${estMs}ms cubic-bezier(.1,.5,.2,1)}.est{font-size:11px;color:#888;font-family:monospace}</style></head><body><div class="box"><h2>${heading}</h2><p class="desc">${message}</p><div class="bar-wrap"><div id="pbar" class="bar"></div></div><div class="est">${estLabel} ~${estSec} ${secLabel}</div></div><script>requestAnimationFrame(()=>requestAnimationFrame(()=>{document.getElementById("pbar").style.width="95%"}));setInterval(()=>fetch("/_hc",{method:"HEAD",cache:"no-store"}).then(r=>r.status===404&&location.reload()).catch(()=>{}),1200);</script></html>
