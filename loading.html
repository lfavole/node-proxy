<!DOCTYPE html>
<html lang="${lang}">
<head>
    <meta charset="utf-8">
    <title>${title}</title>
    <style>
        body {
            font: 1em sans-serif;
            text-align: center;
            margin-top: 6em;
            background: #eee;
            color: #555;
        }
        h2 {
            margin: 0 0 0.5em;
        }
        p {
            color: #777;
            font-size: 0.9em;
            margin: 0.5em 0;
        }
        #bar {
            height: 6px;
            width: 0;
            max-width: 320px;
            background: #39d;
            margin: 2em auto;
            border-radius: 3px;
            animation: p ${estSec}s ease-out forwards;
        }
        @keyframes p {
            to {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <h2>${heading}</h2>
    <p>${message}</p>
    <div id="bar"></div>
    <script>
        // Periodic background poll checking if application port is ready
        setInterval(() => {
            fetch("/_hc", {
                method: "HEAD",
                cache: "no-store",
            })
                .then((r) => {
                    // Status 404 indicates the application has started and is listening
                    if (r.status == 404) {
                        location.reload();
                    }
                })
                .catch(() => {});
        }, 1200);
    </script>
</body>
</html>
