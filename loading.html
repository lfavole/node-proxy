<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Application Loading</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            margin-top: 100px;
            background: #fafafa;
            color: #444;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0066cc;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            animation: spin 1s linear infinite;
            margin: 24px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Application is starting</h2>
    <p>Please wait, this page will reload automatically once ready.</p>
    <script>
        // Periodic background poll to check if application has finished booting
        setInterval(async () => {
            try {
                const response = await fetch("/_hc", {
                    method: "HEAD",
                    cache: "no-store",
                });
                // Status 404 indicates the application is now running
                if (response.status === 404) {
                    window.location.reload();
                }
            } catch (e) {
                // Ignore transient network errors during startup
            }
        }, 1500);
    </script>
</body>
</html>
